plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.azantech.hisabpro'
    compileSdk = 37

    defaultConfig {
        applicationId 'com.azantech.hisabpro'
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = '1.0.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

flutter {
    source '../..'
}
