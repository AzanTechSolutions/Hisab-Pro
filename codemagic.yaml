workflows:
  # ─────────────────────────────────────────────
  # iOS Debug Build (No Apple Developer Account)
  # Generates unsigned .app for simulator testing
  # ─────────────────────────────────────────────
  ios-debug-build:
    name: iOS Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Run static analysis
        script: flutter analyze --no-fatal-infos

      - name: Run unit tests
        script: flutter test

      - name: Build iOS (Debug - No Signing)
        script: |
          flutter build ios --debug --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app

