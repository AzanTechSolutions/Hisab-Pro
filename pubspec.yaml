name: hisab_pro
description: Hisab Pro - Premium offline personal finance manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0
  intl: ^0.20.3
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^17.2.3
  fl_chart: ^0.68.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  path: ^1.9.0
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  crypto: ^3.0.6
  uuid: ^4.5.0
  logger: ^2.0.1
  pdf: ^3.11.1
  printing: ^5.13.2

  # Core utility and local file support
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
